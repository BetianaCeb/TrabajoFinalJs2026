<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tablas</title>
    </head>
<body>
    <table>
        <thead>
        <tr>
            <th>Producto</th>
            <th>Unidad</th>
            <th>Valor</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>Papas</td>
            <td>Kg</td>
            <td>2000</td>
        </tr>
         <tr>
            <td>Cebollas</td>
            <td>Kg</td>
            <td>500</td>
        </tr>
         <tr>
            <td>Melón</td>
            <td>1</td>
            <td>3000</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th class="footer__total">Total</th>
            <td class="total__dato" colspan="2">6500</td>
        </tr>
        </tfoot>
    </table>
</body>
</html>
