<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="inasistencia.html">
    <title>Trabajo Final Betiana</title>
    <script src="tfinal.js" defer></script>
</head>

    <header>
        <h1>Portal de Gestión del Personal</h1>
        <h2>Bienvenidos al Sistema Interno de Comunicaciones de "La empresa"</h2>
        <p class="mensaje">Un espacio seguro en el que podés notificarnos e informarnos todo lo que necesites y recibir novedades institucionales.</p>
    </header>
    <body>
    <main>
        <section class="formularioAU">
            <h3 class="tituloForm">Alta de Empleado</h3>
            <form action="" id="formAlta">
                <label for="leg">Legajo</label>
                <input type="number"  id="leg" name="legajo" placeholder="0000" required max="9999" min="0001">
                <label for="nombre">Nombre y Apellido</label>
                <input type="text" name="nombre" id="nombre" placeholder="Ingrese su Nombre y Apellido" required>
                <label for="domicilio">Domicilio</label>
                <input name="domicilio" type="text" id="domicilio">
                <label for="celular">Celular</label>
                <input type="tex" name="celular" id="celular" placeholder="Ingrese su número de Celular" required>
                <label for="contacto">Nombre Contacto de Emergencia</label>
                <input type="text" name="contacto" id="contacto" placeholder="Ingrese Un contacto" required>
                <label for="celcontacto">Celular Contacto de Emergencia</label>
                <input type="tex" name="celcontacto" id="celcontacto" placeholder="Ingrese el teléfono del contacto Emergencia">
                <button type="submit">Registrarme</button>
                <button type="reset">Borrar Formulario</button>

            </form>

            <p id="mensajeEstado"></p>
    
        </section>
        <section class="oculto">
        <ul id="listaEmpleados"></ul>
        </section>

        <section class="avisos">
            <button><a href="inasistencia.html">Informar Inasistencia</a></button>
            <button>Solicitar Permiso</button>
            <button>Solicitar Anticipo</button>
            <button>Novedades</button>
        </section>


   </main>

    <footer>
        <p>2026 - Desarrollado por DevBety </p>
    </footer>
    
</body>
</html>
