<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informar Inasistencia</title>
    <link rel="stylesheet" href="style.css">
    <script src="inasis.js" defer></script>
</head>
<body>
<header>
    <h4>Completa el formulario para informar la inasistencia</h4>
    <a href="main.html" class="volver">Volver a Inicio</a>
</header>
    <section class="formInas">
    <form action="" id="formInasistencia">
        <label for="leg">Legajo</label>
        <input type="number"  id="leg" name="legajo" placeholder="0000" required max="9999" min="0001">
        <label for="desde">Desde</label>
        <input type="date" id="desde" name="desde" required>
        <label for="hasta">Hasta</label>
        <input type="date" id="hasta" required>
        <label for="motivo">Motivo</label>
        <select name="motivo" id="motivo" required>
            <option value="">Seleccione el Motivo</option>
            <option value="enfermedad">Enfermedad</option>
            <option value="vacaciones">Vacaciones</option>
            <option value="tramites">Tramites Personales</option>
            <option value="injustificada">Injustificada</option>
        </select>
        <label for="comentario">Comentarios</label>
        <textarea name="comentario" id="comentario" rows="4" placeholder="Agregar comentarios."></textarea>
        <button type="submit">Informar a RRHH</button>
        <button type="reset">Borrar Formulario</button>

    </form>
        <p id="mensajeIngresado"></p>
    </section>

    <section>
        <ul id="listaInasistencia"></ul>
    </section>
<footer>
    <p>2026 - Desarrollado por DevBety </p>
</footer>
    
</body>
   
</html>
