<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyframes</title>
    <style>
        @keyframes bounce {
            0% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-45px);
            }
            50% {
                transform: translateY(0);
            }
            70% {
                transform: translateY(-22px);
            }
            100% {
                transform: translateY(0);
            }
        }
        .ball {
            margin: 100px 100px;
            width: 70px;
            height: 70px;
            background: orange;
            border-radius: 50%;
            animation: bounce 1.1s ease infinite;
        }
      


    </style>
</head>
<body>
    <div class="ball"></div>
    
</body>
</html>
