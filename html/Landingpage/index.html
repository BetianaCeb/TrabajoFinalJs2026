<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Inscripción a curso Fronted</title>
</head>
<body>
    <header>
        <h1>Curso Fronted para Principiantes</h1>
        <p>Aprendé HTML, CSS, Y más desde cero</p>
    </header>
    <main>
        <section class="info">
            <h2>Qué vas a aprender?</h2>
            <p>
                Sitio Web desde cero. Estructuras y más
            </p>
        </section>
        <section class="formulario">
            <h2>Inscribite ahora!</h2>
            <form action="">
                <label for="nombre">Nombre completo</label>
                <input type="text" name="nombre" placeholder="Juan requiered" required>
                <label for="email">Correo electrónico</label>
                <input type="email" name="email" placeholder="juan@email.com" required>
                <label for="curso">Curso</label>
                <select name="curso" id="curso" required>
                    <option value="">Selecciona un Curso</option>
                    <option value="fronted">Fronted básico</option>
                    <option value="backended">Backend básico</option>
                    <option value="fullstack">Fullstack Junior</option>
                    
                </select>
                <label for="comentario">Comentarios</label>
                <textarea name="comentario" rows "4" placeholder="Por que queres hacer éste curso?"></textarea>
                <button type="submit">Enviar Inscripción</button>
            </form>
        

        </section>
    </main>

    <footer>
        <p> 2025 CapacitarTec - Desarrollado por DevBety</p>

    </footer>
    
</body>
</html>
