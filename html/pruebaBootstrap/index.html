<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    
    <title>Ejemplo Bootstrap</title>
    <style>
        .btn{
            margin-left: 50px;
        }
        .row {
            overflow: hidden;
        }
        .img-fluid{
            transition: transform 0.3s ease;

        }
        .img-fluid:hover{
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>Bienvenidos al curso</h1>
    <nav class="navbar navbar-dark bg-primary"> 
        <div class="container">
            <span class="nav-brand mb-0 h1">Mi Galeria</span>
        </div>
    </nav> <!--barra que contine menues, iconos, link de navegacion o inicio de sesión-->
    
    <!--Contenido-->
    <div class="container" my-4>
        <h2 class="text-center mb-4"> Galeria de Imagenes</h2>
        <!--Grilla de imagenes (filas responsivas)-->
        <div class="row g-3">
            <div class="col 12 col-sm-6 col-md-4">
                <img src="https://picsum.photos/id/10/400/300" 
                alt="Imagen 1" 
                class="img-fluid rounded">
            </div>
            <div class="col 12 col-sm-6 col-md-4">
                <img src="https://picsum.photos/id/20/400/300" alt="Imagen 2" class="img-fluid rounded">
            </div>
            <div class="col 12 col-sm-6 col-md-4">
                <img src="https://picsum.photos/id/30/400/300" alt="Imagen 3"class="img-fluid rounded">
            </div>
              <div class="col 12 col-sm-6 col-md-4">
                <img src="https://picsum.photos/id/40/400/300" alt="Imagen 3"class="img-fluid rounded">
            </div>
              <div class="col 12 col-sm-6 col-md-4">
                <img src="https://picsum.photos/id/50/400/300" alt="Imagen 3"class="img-fluid rounded">
            </div>
              <div class="col 12 col-sm-6 col-md-4">
                <img src="https://picsum.photos/id/60/400/300" alt="Imagen 3"class="img-fluid rounded">
            </div>
        </div>

    </div>
    
    
    
    
    
    <button class="btn btn-lg btn-primary">Enviar</button>



<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
</body>
</html>
